<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별일없지?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="부모님 안부 버튼과 가족 음성 메시지">
<meta name="theme-color" content="#DDF0FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="별일없지">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&display=swap">
<style>
/* Layout: one phone-width column under a sky band with clouds; parent screen = smiling sun button + voice button. Rounded, chunky, big text. */
:root{
  --sky:#DDF0FF; --bg:#F4FAFF; --surface:#FFFFFF; --ink:#2B2A3D; --muted:#6B6A82; --line:#E3E9F4;
  --sun:#FFC83D; --sun-deep:#F2A007; --sun-ink:#4A3000; --cheek:#FF9DB0;
  --ok:#2FB774; --ok-soft:#DBF6E7; --warn:#F07D1A; --warn-soft:#FFEBD8;
  --voice:#FF6F91; --voice-soft:#FFE6EC; --voice-ink:#FFFFFF; --cloud:#FFFFFF;
  --display:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#1E2547; --bg:#151a33; --surface:#212848; --ink:#F2F3FF; --muted:#A9AECB; --line:#323A60;
  --sun:#FFC83D; --sun-deep:#D98E00; --sun-ink:#3A2600; --cheek:#FF8FA6;
  --ok:#5BD99A; --ok-soft:#1D3F3A; --warn:#FFA052; --warn-soft:#45301F;
  --voice:#FF7E9C; --voice-soft:#43284A; --voice-ink:#2A0F18; --cloud:#2C3460; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#1E2547; --bg:#151a33; --surface:#212848; --ink:#F2F3FF; --muted:#A9AECB; --line:#323A60;
  --sun:#FFC83D; --sun-deep:#D98E00; --sun-ink:#3A2600; --cheek:#FF8FA6;
  --ok:#5BD99A; --ok-soft:#1D3F3A; --warn:#FFA052; --warn-soft:#45301F;
  --voice:#FF7E9C; --voice-soft:#43284A; --voice-ink:#2A0F18; --cloud:#2C3460; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
html,body{margin:0}
html{background:var(--sky)}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
body{background:linear-gradient(var(--sky) 0, var(--bg) 300px);background-color:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:17px;font-weight:500;line-height:1.6;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px;position:relative}
.clouds{position:absolute;inset:0 0 auto;height:90px;pointer-events:none;overflow:hidden}
.clouds svg{position:absolute;fill:var(--cloud)}
.brand{position:relative;display:flex;align-items:center;gap:10px;padding-top:6px}
.logo{width:44px;height:44px;flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:34px;margin:0;line-height:1}
.tag{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface);border-radius:99px;padding:4px 10px;white-space:nowrap}

.roles{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:99px;padding:5px;gap:4px;
  box-shadow:0 4px 0 var(--line)}
.roles button{font:inherit;font-family:var(--display);font-size:16px;border:0;background:none;color:var(--muted);padding:10px 2px;white-space:nowrap;border-radius:99px;cursor:pointer}
.roles button[aria-selected="true"]{background:var(--sun);color:var(--sun-ink)}
button:focus-visible{outline:3px solid var(--voice);outline-offset:3px}
.screen{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 var(--line)}
.greet{font-family:var(--display);font-size:30px;line-height:1.3;margin:0;text-align:center;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:16px}
.date{text-align:center;margin-top:-8px}
.num{font-variant-numeric:tabular-nums}

/* Parent: smiling sun button */
.big{position:relative;align-self:center;width:min(72vw,250px);aspect-ratio:1;max-width:100%;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%, #FFE07A, var(--sun) 60%);color:var(--sun-ink);
  box-shadow:0 10px 0 var(--sun-deep), 0 0 0 14px color-mix(in srgb,var(--sun) 25%,transparent);
  transition:transform .1s, box-shadow .1s;margin-block:16px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.big:active{transform:translateY(8px);box-shadow:0 2px 0 var(--sun-deep), 0 0 0 14px color-mix(in srgb,var(--sun) 25%,transparent)}
.big .face{width:42%;height:auto}
.big b{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.1}
.big small{font-size:15px;font-weight:700;opacity:.75}
.big.done{background:radial-gradient(circle at 35% 30%, #8FE8B9, var(--ok) 65%);color:#fff;box-shadow:0 10px 0 color-mix(in srgb,var(--ok) 65%,#000), 0 0 0 14px var(--ok-soft);cursor:default;transform:none}
.big.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.08)}}
.mic{width:100%;border:0;background:var(--voice);color:var(--voice-ink);font:inherit;font-family:var(--display);font-size:24px;
  border-radius:99px;padding:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px 0 color-mix(in srgb,var(--voice) 65%,#000)}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--voice) 65%,#000)}
.mic svg{width:26px;height:26px;flex:none}
.mic.rec{background:var(--voice-soft);color:var(--voice);box-shadow:0 6px 0 var(--line)}
.mic.rec svg{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.mic.rec svg,.big.pop{animation:none}.big,.mic{transition:none}}

/* Status (me / family) */
.status{display:flex;gap:14px;align-items:center}
.pill{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.pill svg{width:44px;height:44px}
.ok .pill{background:var(--ok-soft);color:var(--ok)}
.wait .pill{background:color-mix(in srgb,var(--sun) 30%,var(--surface));color:var(--sun-deep)}
.late .pill{background:var(--warn-soft);color:var(--warn)}
.status h2{margin:0;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.25}
.status p{margin:0;color:var(--muted);font-size:15px}
.ok h2{color:var(--ok)} .late h2{color:var(--warn)}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clock{background:var(--bg);border-radius:18px;padding:12px 14px}
.clock span{display:block;font-size:13px;color:var(--muted)}
.clock b{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.rule{font-size:15px;color:var(--muted);margin:0;background:color-mix(in srgb,var(--sun) 16%,var(--surface));border-radius:16px;padding:12px 14px}
.rule b{color:var(--ink)}

/* Messages */
.msgs h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px}
.list{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--voice-soft)}
.play{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--voice);color:var(--voice-ink);cursor:pointer;display:grid;place-items:center}
.play svg{width:20px;height:20px;margin-left:3px}
.msg div{min-width:0;flex:1}
.msg strong{display:block;font-size:17px;font-weight:800}
.msg em{font-style:normal;font-size:14px;color:var(--muted)}
.bars{display:flex;gap:3px;align-items:center;height:20px;margin-top:2px}
.bars i{width:4px;border-radius:2px;background:var(--voice);opacity:.6}
.ex{font-size:11px;font-weight:700;background:var(--surface);color:var(--muted);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px}
/* Family management (방장 only) */
.fam-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fam-head h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.members{display:flex;flex-direction:column;gap:8px}
.member{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;border:0;background:var(--bg);border-radius:18px;padding:10px 12px;cursor:pointer}
.member[disabled]{cursor:default}
.ava{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--sun-ink);background:var(--sun)}
.ava.r-family{background:var(--voice-soft);color:var(--voice)} .ava.r-admin{background:var(--ok-soft);color:var(--ok)}
.member div{min-width:0;flex:1} .member strong{display:block;font-size:17px;font-weight:800}
.member em{font-style:normal;font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:20px}
.alert-all{margin:0;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.alert-all b{color:var(--ok)}
.store{background:var(--bg);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.store-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.store-top b{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.meter{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .3s}
.meter.mid i{background:var(--sun-deep)} .meter.high i{background:var(--warn)}
.store p{margin:0;font-size:13px;color:var(--muted)}
.keep{font-size:12px;font-weight:700;color:var(--muted);margin-left:4px}
.limit{margin:-6px 0 0;font-size:13px;color:var(--muted);text-align:center}
.btn{font:inherit;font-family:var(--display);font-size:19px;border:0;border-radius:99px;padding:13px 18px;cursor:pointer}
.btn-sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 5px 0 var(--sun-deep)}
.btn-sun:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:var(--bg);color:var(--ink)}
.btn-danger{background:var(--warn-soft);color:var(--warn)}
.btn-danger-solid{background:var(--warn);color:#fff}
.sheet{border:2px solid var(--sun);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--sun) 8%,var(--surface))}
.sheet h4{margin:0;font-family:var(--display);font-weight:800;font-size:20px}
.code{font-family:var(--display);font-size:38px;letter-spacing:.18em;text-align:center;background:var(--surface);border-radius:16px;padding:8px;font-variant-numeric:tabular-nums}
.link{font-size:14px;color:var(--muted);text-align:center;margin:0;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap} .row .btn{flex:1 1 120px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.f input,.f select{font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.f input:focus,.f select:focus{outline:none;border-color:var(--sun-deep)}
.f select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clock.mine{outline:2px solid var(--sun-deep)}
.clock small{display:block;font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{font:inherit;font-size:16px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:14px;padding:10px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--sun-deep);color:var(--ink);background:color-mix(in srgb,var(--sun) 25%,var(--surface))}
.confirm{background:var(--warn-soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.demo{display:flex;flex-wrap:wrap;gap:8px}
.demo button{font:inherit;font-size:14px;border:2px dashed var(--line);background:none;color:var(--muted);border-radius:99px;padding:8px 14px;cursor:pointer}
.note{font-size:13px;color:var(--muted);margin:0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
/* 고딕체 굵기: 제목·버튼은 굵게 */
.roles button,.greet,.mic,.btn,.code,.ava,.demo button{font-weight:800;letter-spacing:-.01em}
h1,h2,h3,h4,.big b,.clock b{letter-spacing:-.02em}
</style>
</head>
<body>

<div class="wrap">
  <div class="clouds" aria-hidden="true">
    <svg viewBox="0 0 120 50" width="90" style="right:96px;top:-10px;opacity:.7"><path d="M20 45a18 18 0 0 1 4-35 22 22 0 0 1 40-4 18 18 0 0 1 30 10 15 15 0 0 1 6 29z"/></svg>
    <svg viewBox="0 0 120 50" width="74" style="right:-8px;top:4px"><path d="M20 45a18 18 0 0 1 4-35 22 22 0 0 1 40-4 18 18 0 0 1 30 10 15 15 0 0 1 6 29z"/></svg>
  </div>
  <div class="brand">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <g stroke="var(--sun-deep)" stroke-width="7" stroke-linecap="round">
        <path d="M50 4v10M50 86v10M4 50h10M86 50h10M17 17l7 7M76 76l7 7M17 83l7-7M76 24l7-7"/></g>
      <circle cx="50" cy="50" r="30" fill="var(--sun)"/>
      <circle cx="40" cy="47" r="4" fill="var(--sun-ink)"/><circle cx="60" cy="47" r="4" fill="var(--sun-ink)"/>
      <path d="M41 58q9 8 18 0" stroke="var(--sun-ink)" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>별일없지?</h1><span class="tag">시안 v0.6</span>
  </div>

  <div class="roles" role="tablist">
    <button id="tab-parent" role="tab" aria-selected="true" data-role="parent">부모님</button>
    <button id="tab-me" role="tab" aria-selected="false" data-role="me">본인</button>
    <button id="tab-family" role="tab" aria-selected="false" data-role="family">우리가족</button>
    <button id="tab-manage" role="tab" aria-selected="false" data-role="manage">가족정리</button>
  </div>

  <!-- 부모님 화면 -->
  <section class="screen" id="parent">
    <div class="panel">
      <p class="greet" id="pGreet">오늘 별일 없죠?</p>
      <p class="sub num date" id="pDate"></p>
      <button class="big" id="checkBtn"></button>
      <button class="mic" id="pMic" data-limit><svg viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M12 18v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>목소리 남기기</span></button>
      <p class="limit">한 번에 3분까지 남길 수 있어요</p>
    </div>
    <div class="panel msgs"><h3>가족이 보낸 목소리</h3><div class="list" data-viewer="parent"></div></div>
  </section>

  <!-- 본인 -->
  <section class="screen" id="me" hidden>
    <div class="panel">
      <div class="status" data-status></div>
      <div class="clocks" data-clocks="me"></div>
      <p class="rule" data-rule></p>
    </div>
    <div class="panel msgs"><h3>음성 메시지</h3><div class="list" data-viewer="me"></div></div>
    <button class="mic" data-mic="me"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M12 18v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>부모님께 목소리 보내기</span></button>
  </section>

  <!-- 우리가족 -->
  <section class="screen" id="family" hidden>
    <div class="panel">
      <div class="status" data-status></div>
      <div class="clocks" data-clocks="family"></div>
      <p class="rule" data-rule></p>
    </div>
    <div class="panel msgs"><h3>음성 메시지</h3><div class="list" data-viewer="family"></div></div>
    <button class="mic" data-mic="family"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M12 18v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>부모님께 목소리 보내기</span></button>
  </section>

  <!-- 가족정리 (방장만) -->
  <section class="screen" id="manage" hidden>
    <div class="panel" id="famPanel">
      <div class="fam-head"><h3>가족 멤버</h3><span class="count" id="famCount"></span></div>
      <p class="sub" style="font-size:15px;margin:0">멤버를 눌러 이름, 역할, 사는 지역을 바꿀 수 있어요. 지역에 맞춰 시간이 표시돼요.</p>
      <p class="alert-all">안부가 없을 때 알림 받는 사람: <b>가족 전원</b></p>
            <div class="members" id="members"></div>
      <div id="sheet"></div>
      <button class="btn btn-sun" id="inviteBtn">+ 가족 초대하기</button>
    </div>
    <div class="panel"><div class="store" id="store"></div></div>
  </section>

  <div class="panel">
    <p class="sub" style="font-size:14px">시연용 버튼 (실제 앱에는 없음)</p>
    <div class="demo">
      <button id="demoLate">마감 지난 상황 보기</button>
      <button id="demoReset">처음 상태로</button>
    </div>
  </div>
  <p class="note">화면과 흐름 확인용 시안입니다. 실제 녹음과 알림은 서버 연결 단계에서 붙입니다.</p>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const DEADLINE_HOUR = 11; // 부모님이 계신 곳 시간으로 오전 11시까지 안부 없으면 알림
// 지역 → 도시(시간대). 시간대가 여러 개인 지역은 도시를 골라요
const REGIONS = {
  // 대한민국은 시간대가 하나지만 광역시·도별 가장 큰 도시를 고를 수 있어요
  '대한민국': [['서울','Asia/Seoul'],['부산','Asia/Seoul'],['인천','Asia/Seoul'],['대구','Asia/Seoul'],['대전','Asia/Seoul'],['광주','Asia/Seoul'],['울산','Asia/Seoul'],['세종','Asia/Seoul'],['수원 (경기)','Asia/Seoul'],['원주 (강원)','Asia/Seoul'],['청주 (충북)','Asia/Seoul'],['천안 (충남)','Asia/Seoul'],['전주 (전북)','Asia/Seoul'],['순천 (전남)','Asia/Seoul'],['포항 (경북)','Asia/Seoul'],['창원 (경남)','Asia/Seoul'],['제주 (제주)','Asia/Seoul']],
  '캐나다':   [['토론토·몬트리올','America/Toronto'],['밴쿠버','America/Vancouver'],['캘거리·에드먼턴','America/Edmonton'],['위니펙','America/Winnipeg'],['핼리팩스','America/Halifax']],
  '미국':     [['뉴욕·애틀랜타','America/New_York'],['시카고·댈러스','America/Chicago'],['덴버','America/Denver'],['피닉스','America/Phoenix'],['LA·시애틀','America/Los_Angeles'],['앵커리지','America/Anchorage'],['하와이','Pacific/Honolulu']],
  '유럽':     [['런던·리스본','Europe/London'],['파리·베를린·로마','Europe/Paris'],['아테네·헬싱키','Europe/Athens'],['모스크바·이스탄불','Europe/Moscow']],
  '아프리카': [['라고스·카사블랑카','Africa/Lagos'],['카이로','Africa/Cairo'],['요하네스버그','Africa/Johannesburg'],['나이로비','Africa/Nairobi']],
  '호주':     [['시드니·멜버른','Australia/Sydney'],['브리즈번','Australia/Brisbane'],['애들레이드','Australia/Adelaide'],['다윈','Australia/Darwin'],['퍼스','Australia/Perth']],
  '동남아':   [['방콕·하노이','Asia/Bangkok'],['싱가포르·쿠알라룸푸르','Asia/Singapore'],['마닐라','Asia/Manila'],['자카르타','Asia/Jakarta']]
};
const MAX_FAMILY = 5; // 부모님 외 가족 자리
const S = { checked:null, late:false, msgs:[], members:[], sheet:null };
const MAX_REC = 180;        // 음성 1개당 최대 3분
const KEEP_DAYS = 90;       // 90일 뒤 자동 삭제
const QUOTA_MB = 1024;      // 무료 저장 공간 1GB
const KB_PER_SEC = 3;       // 음성 압축 기준 1분 약 180KB
const BASE_MB = 38.4;       // 예시: 지금까지 쌓인 음성 용량
const mmss = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const seed = () => [{from:'sib', to:'parent', len:74, when:'어제 저녁', age:1, ex:true},
                    {from:'mom', to:'all', len:142, when:'어제 오전', age:1, ex:true}];
const seedMembers = () => [
  {id:'mom', name:'어머니', role:'parent', since:'10월 28일', region:'대한민국', city:0},
  {id:'me',  name:'본인',   role:'admin',  since:'10월 28일', region:'캐나다',   city:0},
  {id:'sib', name:'동생',   role:'family', since:'10월 29일', region:'대한민국', city:0, ex:true}];
S.msgs = seed(); S.members = seedMembers();
const ROLE = {parent:'부모님', admin:'방장 (본인)', family:'가족'};
const nameOf = id => (S.members.find(m=>m.id===id)||{}).name || '나간 가족';
const parentName = () => (S.members.find(m=>m.role==='parent')||{name:'부모님'}).name;
const memberOf = id => S.members.find(m=>m.id===id);
const cityOf = m => { const c = (REGIONS[m&&m.region]||REGIONS['대한민국']); return c[m&&m.city] || c[0]; };
const tzOf = m => cityOf(m)[1];
const placeOf = m => cityOf(m)[0];
const parentM = () => S.members.find(m=>m.role==='parent') || {region:'대한민국', city:0};
const viewerOf = v => v==='me' ? memberOf('me') : v==='family' ? (memberOf('sib') || S.members.find(m=>m.role==='family')) : parentM();
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 표정 얼굴: happy(웃는 눈), wait(동그란 눈), worry(걱정)
function face(mood){
  const eyes = mood==='happy'
    ? '<path d="M28 44q8-9 16 0M56 44q8-9 16 0" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>'
    : '<circle cx="36" cy="42" r="6" fill="currentColor"/><circle cx="64" cy="42" r="6" fill="currentColor"/>';
  const mouth = mood==='worry'
    ? '<path d="M38 70q12-8 24 0" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>'
    : mood==='happy' ? '<path d="M34 60q16 18 32 0z" fill="currentColor"/>'
    : '<path d="M38 62q12 10 24 0" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>';
  return '<svg class="face" viewBox="0 0 100 90" aria-hidden="true">'+eyes+mouth+
    '<ellipse cx="22" cy="58" rx="8" ry="5" fill="var(--cheek)" opacity=".8"/><ellipse cx="78" cy="58" rx="8" ry="5" fill="var(--cheek)" opacity=".8"/></svg>';
}
const PLAY = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 2.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 4 2.5z"/></svg>';

const fmt = (tz, opt) => new Intl.DateTimeFormat('ko-KR', {timeZone:tz, ...opt});
const zParts = (tz,d) => Object.fromEntries(fmt(tz,{year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(d).map(p=>[p.type,p.value]));
const tzOffset = (tz,d) => { const p=zParts(tz,d); return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute) - Math.floor(d.getTime()/60000)*60000; };
// 부모님 시간대로 오늘 오전 11시가 몇 시(UTC)인지
function deadlineDate(now, tz){ const p=zParts(tz,now); const guess=Date.UTC(+p.year,+p.month-1,+p.day,DEADLINE_HOUR,0); return new Date(guess - tzOffset(tz,new Date(guess - tzOffset(tz,new Date(guess))))); }
const timeKo = (tz,d) => fmt(tz,{hour:'numeric',minute:'2-digit'}).format(d);
const dayKo = (tz,d) => fmt(tz,{month:'long',day:'numeric',weekday:'short'}).format(d);

function render(){
  const now = new Date();
  const P = parentM(), ptz = tzOf(P), pplace = placeOf(P);
  document.getElementById('pDate').textContent = pplace + ' ' + dayKo(ptz,now) + ' · ' + timeKo(ptz,now);
  const pn = parentName();
  document.getElementById('pGreet').textContent = '오늘 별일 없죠?';
  const btn = document.getElementById('checkBtn');
  if (S.checked){ btn.classList.add('done'); btn.innerHTML = face('happy') + '<b>전달했어요!</b><small>' + timeKo(ptz,S.checked) + ' 안부 완료</small>'; }
  else { btn.classList.remove('done'); btn.innerHTML = face('wait') + '<b>별일 없어요</b><small>한 번 눌러 주세요</small>'; }

  const dl = deadlineDate(now, ptz);
  document.querySelectorAll('[data-clocks]').forEach(box=>{
    const mine = viewerOf(box.dataset.clocks);
    box.innerHTML = S.members.map(m =>
      '<div class="clock'+(m===mine?' mine':'')+'"><span>'+esc(m.name)+(m.role==='parent'?' (부모님)':'')+'</span><b class="num">'+timeKo(tzOf(m),now)+'</b><small>'+esc(m.region+' · '+placeOf(m))+' · '+fmt(tzOf(m),{weekday:'short'}).format(now)+'</small></div>').join('');
  });
  document.querySelectorAll('[data-rule]').forEach(e=>{
    const v = viewerOf(e.closest('.screen').id); const vtz = tzOf(v);
    e.innerHTML = '안부 마감은 <b>부모님 계신 '+esc(pplace)+' 시간 오전 '+DEADLINE_HOUR+'시</b>' +
      (vtz===ptz ? '' : ', '+esc(placeOf(v))+' 시간으로는 <b>' + dayKo(vtz,dl) + ' ' + timeKo(vtz,dl) + '</b>') +
      '예요. 그때까지 버튼이 안 눌리면 가족 모두에게 알림이 가요.'; });
  let cls, mood, title, desc;
  if (S.checked){ cls='ok'; mood='happy'; title='오늘도 별일 없어요!'; desc=esc(pplace)+' 시간 ' + timeKo(ptz,S.checked) + '에 '+esc(pn)+'가 누르셨어요'; }
  else if (S.late){ cls='late'; mood='worry'; title='아직 안부가 없어요'; desc='마감이 지났어요. 전화 한 통 드려 보세요'; }
  else { cls='wait'; mood='wait'; title='오늘 안부 기다리는 중'; desc=esc(pplace)+' 시간 오전 '+DEADLINE_HOUR+'시까지 기다려요'; }
  document.querySelectorAll('[data-status]').forEach(e=>{ e.className='status '+cls;
    e.innerHTML = '<div class="pill">'+face(mood)+'</div><div><h2>'+title+'</h2><p>'+desc+'</p></div>'; });

  document.querySelectorAll('.list').forEach(list=>{
    const v = list.dataset.viewer;
    const me = v==='parent'?'mom':v==='me'?'me':'sib';
    const items = S.msgs.filter(m => m.from!==me);
    list.innerHTML = items.length ? items.map(m => {
      const bars = Array.from({length:20},(_,i)=>'<i style="height:'+(5+Math.abs(Math.sin(i*1.7+m.len))*15).toFixed(0)+'px"></i>').join('');
      const fm = memberOf(m.from); const from = esc(fm ? fm.name+' ('+placeOf(fm)+')' : nameOf(m.from));
      return '<div class="msg"><button class="play" aria-label="'+from+' 음성 재생">'+PLAY+'</button><div><strong>'+from+(m.ex?'<span class="ex">예시</span>':'')+
        '</strong><em class="num">'+m.when+' · '+mmss(m.len)+'<span class="keep">· '+(KEEP_DAYS-(m.age||0))+'일 뒤 삭제</span></em><div class="bars">'+bars+'</div></div></div>'; }).join('')
      : '<p class="sub">아직 받은 메시지가 없어요</p>';
  });
  renderFamily();
}

function renderStore(){
  const used = BASE_MB + S.msgs.reduce((a,m)=>a+m.len*KB_PER_SEC/1024,0);
  const pct = used/QUOTA_MB*100;
  document.getElementById('store').innerHTML =
    '<div class="store-top"><span>저장 공간<span class="ex">예시</span></span><b>'+pct.toFixed(1)+'% 사용</b></div>'+
    '<div class="meter '+(pct>=85?'high':pct>=60?'mid':'')+'" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct.toFixed(0)+'" aria-label="저장 공간 사용량"><i style="width:'+Math.max(2,Math.min(100,pct))+'%"></i></div>'+
    '<p class="num">'+used.toFixed(1)+'MB / 1GB · 남은 공간으로 약 '+Math.floor((QUOTA_MB-used)*1024/KB_PER_SEC/60).toLocaleString()+'분 더 녹음할 수 있어요</p>'+
    '<p>음성은 '+KEEP_DAYS+'일이 지나면 자동으로 지워져요. 새 음성은 푸시 알림으로 알려 드려요.</p>';
}

function renderFamily(){
  renderStore();
  const fam = S.members.filter(m=>m.role!=='parent').length;
  document.getElementById('famCount').textContent = '가족 '+fam+' / '+MAX_FAMILY+'명';
  document.getElementById('members').innerHTML = S.members.map(m =>
    '<button class="member" data-id="'+m.id+'">'+
    '<span class="ava r-'+m.role+'">'+esc(m.name.slice(0,1))+'</span>'+
    '<div><strong>'+esc(m.name)+(m.ex?'<span class="ex">예시</span>':'')+'</strong><em>'+ROLE[m.role]+' · '+'<span style="white-space:nowrap">'+esc(m.region+' '+placeOf(m))+'</span> · <span style="white-space:nowrap">지금 '+timeKo(tzOf(m),new Date())+'</span></em></div>'+
    '<span class="chev">›</span></button>').join('');
  const inv = document.getElementById('inviteBtn');
  inv.disabled = fam>=MAX_FAMILY; inv.hidden = !!S.sheet;
  inv.textContent = fam>=MAX_FAMILY ? '가족 자리가 다 찼어요' : '+ 가족 초대하기';
  const sh = document.getElementById('sheet');
  if (!S.sheet){ sh.innerHTML=''; return; }
  if (S.sheet.type==='invite'){
    const c = S.sheet.code;
    sh.innerHTML = '<div class="sheet"><h4>초대 코드가 만들어졌어요</h4>'+
      '<div class="code">'+c+'</div><p class="link">byeolil.app/join/'+c+'</p>'+
      '<p class="sub" style="font-size:14px">카카오톡으로 링크를 보내 주세요. 받은 사람은 이름만 입력하면 들어와요. <b>48시간 뒤 자동으로 만료</b>돼요.<br>부모님 폰은 가까이 사는 가족이 이 링크를 대신 열고 "부모님으로 등록"을 누르면 돼요.</p>'+
      '<div class="row"><button class="btn btn-sun" data-act="copy">링크 복사</button><button class="btn btn-ghost" data-act="demoJoin">합류 시연</button></div>'+
      '<button class="btn btn-ghost" data-act="close">닫기</button></div>';
  } else {
    const m = S.members.find(x=>x.id===S.sheet.id); if(!m){S.sheet=null;return renderFamily();}
    const r = S.sheet.role, isAdmin = m.role==='admin';
    const cities = REGIONS[S.sheet.region];
    const regionSel = '<div class="f2"><label class="f" for="editRegion">사는 지역<select id="editRegion">'+
        Object.keys(REGIONS).map(k=>'<option'+(k===S.sheet.region?' selected':'')+'>'+k+'</option>').join('')+'</select></label>'+
      '<label class="f" for="editCity">도시'+(cities.length>1?'':' (시간대 1개)')+'<select id="editCity"'+(cities.length>1?'':' disabled')+'>'+
        cities.map((c,i)=>'<option value="'+i+'"'+(i===S.sheet.city?' selected':'')+'>'+c[0]+'</option>').join('')+'</select></label></div>'+
      '<p class="sub" style="font-size:14px;margin:0">그곳 지금 시각: <b class="num">'+timeKo(cities[S.sheet.city][1],new Date())+'</b></p>';
    sh.innerHTML = '<div class="sheet"><h4>'+esc(m.name)+' 정보 수정</h4>'+
      '<label class="f" for="editName">표시 이름<input id="editName" maxlength="10" value="'+esc(S.sheet.name)+'"></label>'+
      (isAdmin ? '' : '<div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)">역할<div class="seg">'+
        '<button data-role-pick="family" aria-pressed="'+(r==='family')+'">가족</button><button data-role-pick="parent" aria-pressed="'+(r==='parent')+'">부모님</button></div></div>')+
      regionSel+
      '<div class="row"><button class="btn btn-sun" data-act="save">저장</button><button class="btn btn-ghost" data-act="close">취소</button></div>'+
      (isAdmin ? '<p class="sub" style="font-size:13px;margin:0">방장은 역할을 바꾸거나 내보낼 수 없어요.</p>' : S.sheet.confirm
        ? '<div class="confirm"><span><b>'+esc(m.name)+'</b>님을 가족방에서 내보낼까요? 그 폰에서는 바로 접속이 끊겨요. 다시 들어오려면 새로 초대해야 해요.</span>'+
          '<div class="row"><button class="btn btn-danger-solid" data-act="remove">내보내기</button><button class="btn btn-ghost" data-act="cancelRemove">그대로 두기</button></div></div>'
        : '<button class="btn btn-danger" data-act="askRemove">가족방에서 내보내기</button>')+'</div>';
  }
}

document.getElementById('members').addEventListener('click',e=>{
  const b=e.target.closest('.member'); if(!b) return;
  const m=S.members.find(x=>x.id===b.dataset.id); S.sheet={type:'edit',id:m.id,name:m.name,role:m.role,region:m.region,city:m.city||0,confirm:false}; renderFamily();
  document.getElementById('editName')?.focus();
});
document.getElementById('inviteBtn').addEventListener('click',()=>{
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<6;i++) c+=A[Math.floor(Math.random()*A.length)];
  S.sheet={type:'invite',code:c}; renderFamily();
});
document.getElementById('sheet').addEventListener('input',e=>{ if(e.target.id==='editName') S.sheet.name=e.target.value; });
document.getElementById('sheet').addEventListener('change',e=>{
  if(e.target.id==='editRegion'){ S.sheet.region=e.target.value; S.sheet.city=0; renderFamily(); document.getElementById('editRegion')?.focus(); }
  else if(e.target.id==='editCity'){ S.sheet.city=+e.target.value; renderFamily(); document.getElementById('editCity')?.focus(); }
});
document.getElementById('sheet').addEventListener('click',e=>{
  const pick=e.target.closest('[data-role-pick]'); if(pick){ S.sheet.role=pick.dataset.rolePick; renderFamily(); return; }
  const act=(e.target.closest('[data-act]')||{}).dataset?.act; if(!act) return;
  if(act==='close'){ S.sheet=null; renderFamily(); }
  else if(act==='copy'){ const t='https://byeolil.app/join/'+S.sheet.code;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('초대 링크를 복사했어요'),()=>toast('복사가 안 됐어요. 링크를 길게 눌러 복사해 주세요')); }
  else if(act==='demoJoin'){ S.members.push({id:'f'+Date.now(), name:'새 가족', role:'family', since:'오늘', region:'대한민국', city:0}); S.sheet=null; render(); toast('새 가족이 들어왔어요. 눌러서 이름을 바꿔 보세요'); }
  else if(act==='save'){ const n=S.sheet.name.trim(); if(!n){ toast('이름을 적어 주세요'); return; }
    if(S.sheet.role==='parent' && S.members.some(x=>x.role==='parent' && x.id!==S.sheet.id) && S.members.filter(x=>x.role==='parent').length>=2){ toast('부모님은 두 분까지 등록할 수 있어요'); return; }
    const m=S.members.find(x=>x.id===S.sheet.id); m.name=n; if(m.role!=='admin') m.role=S.sheet.role; m.region=S.sheet.region; m.city=S.sheet.city; S.sheet=null; render(); toast('저장했어요'); }
  else if(act==='askRemove'){ S.sheet.confirm=true; renderFamily(); }
  else if(act==='cancelRemove'){ S.sheet.confirm=false; renderFamily(); }
  else if(act==='remove'){ const m=S.members.find(x=>x.id===S.sheet.id); S.members=S.members.filter(x=>x.id!==S.sheet.id); S.sheet=null; render(); toast(m.name+'님을 내보냈어요'); }
});

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }

document.querySelectorAll('.roles button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.roles button').forEach(x=>x.setAttribute('aria-selected', x===b));
  ['parent','me','family','manage'].forEach(id=>document.getElementById(id).hidden = id!==b.dataset.role);
}));
document.getElementById('checkBtn').addEventListener('click',e=>{
  if (S.checked) return; S.checked = new Date(); S.late=false; render();
  e.currentTarget.classList.add('pop'); setTimeout(()=>e.currentTarget?.classList.remove('pop'),500);
  toast('안부가 가족 모두에게 전해졌어요');
});

function wireMic(btn, from){
  let t0=null, iv=null; const label = btn.querySelector('span'); const orig = label.textContent;
  btn.addEventListener('click',()=>{
    if (!t0){ t0=Date.now(); btn.classList.add('rec');
      iv=setInterval(()=>{ const s=Math.min(MAX_REC,Math.round((Date.now()-t0)/1000)); label.textContent='녹음 중 '+mmss(s)+' / 3:00 · 누르면 보내요'; if(s>=MAX_REC){ btn.click(); toast('3분이 되어 자동으로 보냈어요'); } },250);
      label.textContent='녹음 중 0:00 / 3:00 · 누르면 보내요'; }
    else { clearInterval(iv); const len=Math.max(1,Math.min(MAX_REC,Math.round((Date.now()-t0)/1000))); t0=null;
      btn.classList.remove('rec'); label.textContent=orig;
      S.msgs.unshift({from, to: from==='mom'?'all':'parent', len, when:'방금'}); render();
      toast('목소리를 보냈어요 (시안이라 실제 녹음은 아직)'); }
  });
}
wireMic(document.getElementById('pMic'),'mom');
wireMic(document.querySelector('[data-mic="me"]'),'me');
